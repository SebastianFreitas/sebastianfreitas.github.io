<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banner lab</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #040405; color: #cfcab8; font: 12px/1.3 system-ui, sans-serif; }
  #app { display: flex; gap: 16px; padding: 12px; align-items: flex-start; }
  #ctl { flex: 0 0 300px; max-height: 96vh; overflow: auto; }
  #ctl .row { display: flex; align-items: center; gap: 4px; margin: 2px 0; }
  #ctl label { flex: 0 0 82px; color: #8d8a7c; overflow: hidden; text-overflow: ellipsis; }
  #ctl input[type=range] { flex: 1; min-width: 0; }
  #ctl input[type=number] { width: 58px; }
  #ctl input[type=text] { flex: 1; min-width: 0; }
  #ctl .lock { cursor: pointer; width: 22px; padding: 0; }
  #ctl .lock.on { background: #b8a14a; color: #000; }
  #bar { margin: 6px 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  button, input { background: #1b2023; color: #cfcab8; border: 1px solid #333a3e; font: inherit; }
  button { cursor: pointer; padding: 3px 7px; }
  #mid { flex: 1; min-width: 0; }
  #views { display: flex; gap: 24px; align-items: flex-start; padding: 24px 0; }
  #sheet { display: block; margin-top: 12px; cursor: pointer; }
  #cv.only { display: block; }
</style>
</head>
<body>
<div id="app">
  <div id="ctl"></div>
  <div id="mid">
    <div id="views"><canvas id="big"></canvas><canvas id="small"></canvas></div>
    <canvas id="sheet"></canvas>
  </div>
</div>
<script src="../js/site/shapes.js"></script>
<script src="../js/site/banner.js"></script>
<script src="banner-lab.js"></script>
</body>
</html>
